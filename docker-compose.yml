services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/swipchat.db
      JWT_SECRET: dev-compose-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - swipchat_db:/app/data
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend

volumes:
  swipchat_db:
